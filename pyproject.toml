[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "formation-sim"
version = "0.1.0"
description = "Multi-agent formation control simulator: consensus / leader-follower laws, CBF and potential-field avoidance, dropout robustness."
requires-python = ">=3.10"
dependencies = ["numpy", "scipy", "matplotlib", "pillow"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
